# DNS防泄露版本
# 必读！！！
# 注意规则在满足自己需求情况下，尽量做到精简，不要过度复杂，以免影响性能。
# 跑裸核用户请自行去掉下方控制面板模块的注释。
# 机场订阅
proxy-providers:
  Amy:
    url: ""
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 10000
      lazy: true
    proxy: 直连
  Ikuun:
    url: ""
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 10000
      lazy: true
    proxy: 直连
  Cf:
    url: ""
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 10000
      lazy: true
  Cute:
    url: ""
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 10000
      lazy: true
    proxy: 直连
# 节点信息
proxies:
  - {name: 直连, type: direct}

# 全局配置 
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

# 为防止使用插件朋友遇到面板问题，我注释掉了此模块。
#external-controller: 0.0.0.0:9090
#secret: ""
#external-ui: ui
#external-ui-name: zashboard
#external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 嗅探（fakeip下其实可以不用嗅探）
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# 入站
tun:
  enable: true
  # system/gvisor/mixed
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  #使用nikki，混入全部不修改的情况，开启接口指定为nikki
  #device: nikki
  #使用仅内核自行修改下面三项为true
  auto-route: false
  auto-redirect: false
  auto-detect-interface: false

# DNS模块
dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: redir-host
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  respect-rules: true          # ← 现在可以放心开了

  # === 必须新增：专门解析代理节点域名的 DNS（直连国内，防循环）===
  proxy-server-nameserver:
    - 223.5.5.5                  # 阿里（推荐首选）
    - 119.29.29.29               # 腾讯
    - https://doh.pub/dns-query  # 腾讯 DoH（最稳）

  # （可选）如果你订阅链接或节点域名是特定机场的，可以再加 policy 锁定
  # proxy-server-nameserver-policy:
  #   '+.你的机场域名.com': [223.5.5.5]

  # 其余保持你原来的（default-nameserver、nameserver、fallback 等）
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 180.76.76.76
  nameserver:
    - quic://dns.alidns.com
    - tls://dns.alidns.com
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - tls://dot.pub
# === 关键：防污染过滤器（已修复）===
  fallback-filter:
    geoip: true
    geoip-code: CN                    # ← 必须改成 CN
    geosite:
      - gfw
    domain:
      - '+.google.com'
      - '+.facebook.com'
      - '+.youtube.com'
      - '+.twitter.com'

# 出站策略，根据自己情况调整每个策略里分组排序，增删都可以，比如把美国自动放到第一个，比如删除香港故转，注意别漏掉表情逗号等。
# 如果相应分组没有筛选到对应的国家，请根据自己节点名字调整筛选关键字。
# 没有再使用锚点，是考虑很多新手修改难度，这样新手修改某个分组更容易些。
proxy-groups:
  - {name: 🌐 全部节点, type: select, include-all: true}
  - {name: 🚀 默认代理, type: select, proxies: [🔯 全局故转, 🌐 全部节点, ✈️ Amy-香港, ✈️ Amy-日本, ✈️ Amy-台湾, ✈️ Amy-新加坡, ✈️ Amy-美国, ✈️ Ikuun-香港, ✈️ Ikuun-日本, ✈️ Ikuun-台湾, ✈️ Ikuun-新加坡, ✈️ Ikuun-美国, ✈️ Amy 节点, ✈️ Ikuun 节点, 直连]}
  - {name: 🔯 全局故转, type: fallback, proxies: [✈️ Amy-香港, ✈️ Ikuun-香港,✈️ Amy-美国,✈️ Ikuun-美国, ✈️ Amy-日本, ✈️ Ikuun-日本], interval: 300}
  - {name: 🐟 漏网之鱼, type: select, proxies: [直连, 🚀 默认代理, 🔯 全局故转, 🌐 全部节点, ✈️ Amy-香港, ✈️ Amy-日本, ✈️ Amy-台湾, ✈️ Amy-新加坡, ✈️ Amy-美国, ✈️ Ikuun-香港, ✈️ Ikuun-日本, ✈️ Ikuun-台湾, ✈️ Ikuun-新加坡, ✈️ Ikuun-美国, ✈️ Amy 节点, ✈️ Ikuun 节点]}
  - {name: ✈️ Amy 节点, type: select, use: [Amy]}
  - {name: ✈️ Amy-香港, type: select, use: [Amy], filter: "(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$"}
  - {name: ✈️ Amy-日本, type: select, use: [Amy], filter: "(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$"}
  - {name: ✈️ Amy-台湾, type: select, use: [Amy], filter: "(?=.*(台|TW|(?i)Taiwan))^((?!(港|日|韩|新|美)).)*$"}
  - {name: ✈️ Amy-新加坡, type: select, use: [Amy], filter: "(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(台|日|韩|港|美)).)*$"}
  - {name: ✈️ Amy-美国, type: select, use: [Amy], filter: "(?=.*(美|US|(?i)States|America))^((?!(港|台|韩|新|日)).)*$"}
